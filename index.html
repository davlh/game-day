<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Day</title>
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c232c; --line: #2a323d;
    --text: #e6edf3; --muted: #8b96a3; --accent: #3ddc84; --live: #ff4d4f; --fav: #f5c542;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(13,17,23,.94); backdrop-filter: blur(8px);
    padding: calc(env(safe-area-inset-top) + 10px) 14px 8px; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 8px; }
  .top h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: .2px; }
  .top h1 span { color: var(--accent); }
  .icon-btn { background: none; border: 0; color: var(--muted); font-size: 20px; padding: 6px 8px; border-radius: 8px; }
  .icon-btn:active { background: var(--panel2); }
  #updated { color: var(--muted); font-size: 11px; text-align: right; margin-top: 4px; min-height: 13px; }
  #tv { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 10px; font: 600 13px system-ui, sans-serif; max-width: 46vw; }
  dialog textarea { width: 100%; min-height: 72px; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: 13px ui-monospace, monospace; resize: vertical; }
  dialog label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 6px; }
  #tabs { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .tab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .days { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  .day { flex: 0 0 auto; background: none; border: 0; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  .day.on { color: var(--text); background: var(--panel2); font-weight: 600; }
  .filter { display: flex; gap: 6px; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: none; color: var(--muted); padding: 4px 10px; border-radius: 999px; font-size: 12px; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  main { padding: 6px 12px calc(env(safe-area-inset-bottom) + 40px); max-width: 640px; margin: 0 auto; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 18px 4px 8px; }
  .card { display: block; width: 100%; text-align: left; color: inherit; font: inherit;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 0 0 8px; cursor: pointer; }
  .card:active { background: var(--panel2); transform: scale(.995); }
  .card.fav { border-color: rgba(245,197,66,.45); }
  .card.is-live { box-shadow: inset 3px 0 0 var(--live); }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .status .star { margin-left: auto; color: var(--fav); }
  .live { color: #fff; background: var(--live); font-weight: 700; font-size: 10px; padding: 1px 5px; border-radius: 4px; letter-spacing: .5px; }
  .ltag { font-weight: 700; color: var(--text); background: var(--panel2); padding: 1px 6px; border-radius: 4px; font-size: 10px; }
  .team { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
  .team img, .logo-ph { width: 26px; height: 26px; object-fit: contain; flex: 0 0 26px; }
  .tname { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank { color: var(--muted); font-size: 12px; font-weight: 600; margin-right: 5px; }
  .rec { color: var(--muted); font-size: 12px; flex: 1; }
  .score { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .team.lost .tname, .team.lost .score { color: var(--muted); }
  .where { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; }
  .nets { color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .target { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .empty, .notice { text-align: center; color: var(--muted); padding: 40px 16px; }
  .notice { padding: 12px; margin-top: 12px; background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; }
  .notice a { color: var(--accent); }
  .err { color: #ff9b9b; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: .2s; pointer-events: none; max-width: 92vw; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; width: min(92vw, 460px); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 8px; }
  dialog p, dialog li { color: var(--muted); font-size: 13px; }
  dialog input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 13px ui-monospace, monospace; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #062b16; }
  .btn.ghost { background: var(--panel2); color: var(--text); }
  #sid-err { color: #ff9b9b; font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Game<span>Day</span></h1>
    <select id="tv" aria-label="TV to play on"></select>
    <button class="icon-btn" id="refresh" aria-label="Refresh">⟳</button>
    <button class="icon-btn" id="gear" aria-label="Settings">⚙</button>
  </div>
  <nav id="tabs"></nav>
  <div id="sub"></div>
  <div id="updated"></div>
</header>
<main id="list"></main>
<div id="toast" role="status"></div>

<dialog id="settings">
  <form method="dialog">
    <h3>Settings</h3>
    <label for="sid">Play on TV shortcut</label>
    <p>Paste its ID or deep link. In HTTP Shortcuts, long-press the shortcut → <i>Show Info</i>.</p>
    <input id="sid" placeholder="http-shortcuts://… or the shortcut ID" autocomplete="off" spellcheck="false">
    <label for="tvlist">TVs</label>
    <p>One per line as <code>Name = Roku IP</code>. Find the IP on the Roku: Settings → Network → About.</p>
    <textarea id="tvlist" spellcheck="false" autocomplete="off"></textarea>
    <div id="sid-err"></div>
    <p>Teams, leagues and channel mappings live in <code>config.js</code>.</p>
    <div class="row">
      <button class="btn ghost" id="close">Cancel</button>
      <button class="btn primary" id="save">Save</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
